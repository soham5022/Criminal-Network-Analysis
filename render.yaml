services:
  - type: web
    name: tracenet-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false   # Set manually in Render dashboard after Vercel deploy
      - key: NEO4J_URI
        value: ""     # Leave blank to use NetworkX in-memory fallback
      - key: NEO4J_USERNAME
        value: ""
      - key: NEO4J_PASSWORD
        value: ""
    healthCheckPath: /api/health
    autoDeploy: true
